:root{--bg:#f7f3ee;--card:#fff;--ink:#25211e;--muted:#776e67;--line:#e6ddd4;--accent:#756052;--soft:#efe8e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;padding-bottom:86px}header{position:sticky;top:0;z-index:5;padding:calc(18px + env(safe-area-inset-top)) 16px 10px;background:rgba(247,243,238,.96);backdrop-filter:blur(12px)}h1{margin:0;font-size:29px}.sub{color:var(--muted);font-size:13px}main{max-width:760px;margin:auto;padding:8px 14px 24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 8px 24px rgba(52,42,34,.06)}.full{grid-column:1/-1}.metric{font-size:27px;font-weight:750;margin-top:4px}.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:6px 9px;font-size:12px;margin:2px}.page{display:none}.page.active{display:block}h2{font-size:22px;margin:8px 2px 12px}label{display:block;font-size:12px;font-weight:700;color:#655d56;margin:11px 0 5px}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font:inherit;color:inherit}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:750;background:var(--ink);color:#fff}.btn.secondary{background:var(--soft);color:var(--ink)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions .btn{flex:1}.day{padding:11px 0;border-bottom:1px solid var(--line)}.day:last-child{border-bottom:0}.daytop{display:flex;justify-content:space-between;gap:8px}.daymeta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.navbtn{border:0;background:transparent;padding:8px 2px;border-radius:11px;color:var(--muted);font-size:11px}.navbtn b{display:block;font-size:19px}.navbtn.active{background:var(--soft);color:var(--ink)}.notice{font-size:13px;line-height:1.45;background:#fbf7f1;border-left:4px solid #b59b87;padding:10px 12px;border-radius:10px}.chart{height:150px;display:flex;align-items:end;gap:7px;margin-top:8px}.bar{flex:1;min-width:12px;background:#d6c8bc;border-radius:8px 8px 2px 2px;position:relative}.bar span{position:absolute;bottom:100%;font-size:9px;left:50%;transform:translateX(-50%);white-space:nowrap;color:var(--muted)}

<header><h1>Mijn Balans</h1><div class="sub">gewicht · voeding · cyclus · beweging · doel 63 kg</div></header>
<main>
<section id="home" class="page active"><h2>Overzicht</h2><div class="grid"><div class="card"><div class="sub">Laatste gewicht</div><div class="metric" id="lastWeight">—</div></div><div class="card"><div class="sub">Tot doel</div><div class="metric" id="toGoal">—</div></div><div class="card full"><div class="sub">Recente gewichtstrend</div><div id="chart" class="chart"></div></div><div class="card full"><h3>Automatische analyse</h3><div id="analysis" class="notice"></div></div></div></section>
<section id="entry" class="page"><h2>Dag invoeren</h2><div class="card"><form id="form"><div class="row"><div><label>Datum</label><input id="date" type="date" required></div><div><label>Ochtendgewicht (kg)</label><input id="weight" type="number" step="0.05"></div></div><div class="row"><div><label>Slaap (uur)</label><input id="sleep" type="number" step="0.25"></div><div><label>Cyclusdag</label><input id="cycleDay" type="number"></div></div><div class="row"><div><label>Cyclusfase</label><select id="cyclePhase"><option value="">—</option><option>menstruatie</option><option>folliculair</option><option>ovulatie</option><option>luteaal</option></select></div><div><label>Progesteron (mg)</label><input id="progesterone" type="number" step="50"></div></div><div class="row"><div><label>Lenzetto sprays</label><input id="lenzetto" type="number" value="1"></div><div><label>Ontlasting</label><select id="stool"><option value="">—</option><option value="0">nee</option><option value="1">1x</option><option value="2">2x of meer</option></select></div></div><div class="row"><div><label>Buik ochtend (0–10)</label><input id="bloatMorning" type="number" min="0" max="10"></div><div><label>Buik avond (0–10)</label><input id="bloatEvening" type="number" min="0" max="10"></div></div><label>Ontbijt</label><textarea id="breakfast"></textarea><label>Lunch</label><textarea id="lunch"></textarea><label>Tussendoor</label><textarea id="snacks"></textarea><label>Avondeten</label><textarea id="dinner"></textarea><label>Extra na avondeten</label><textarea id="extra"></textarea><div class="row"><div><label>Honger na avondeten (0–10)</label><input id="hunger" type="number" min="0" max="10"></div><div><label>Cola/koolzuur (aantal)</label><input id="cola" type="number"></div></div><div class="row"><div><label>Koffie/melkdranken</label><input id="coffee" type="number"></div><div><label>Beweging (min)</label><input id="movementMin" type="number"></div></div><div class="row"><div><label>Kcal (optioneel)</label><input id="kcal" type="number"></div><div><label>Eiwit g (optioneel)</label><input id="protein" type="number"></div></div><label>Beweging / training</label><textarea id="movementText"></textarea><label>Calorierijke extra's / porties</label><textarea id="denseFoods" placeholder="bijv. 25 g noten, 1 avocado, kaas, olie, saus"></textarea><label>Bijzonderheden</label><textarea id="notes"></textarea><div class="actions"><button class="btn" type="submit">Opslaan</button><button class="btn secondary" type="button" id="clear">Nieuw/leeg</button></div></form></div></section>
<section id="history" class="page"><h2>Geschiedenis</h2><div class="card" id="historyList"></div></section>
<section id="more" class="page"><h2>Meer</h2><div class="card"><label>Streefgewicht</label><input id="goal" type="number" step="0.1" value="63"><label>Gewenst tempo</label><select id="pace"><option value="0.25">±0,25 kg/week</option><option value="0.4" selected>±0,4 kg/week</option><option value="0.5">±0,5 kg/week</option></select><div class="actions"><button id="saveSettings" class="btn">Opslaan</button></div><div id="goalText" class="notice" style="margin-top:12px"></div></div><div class="card" style="margin-top:10px"><h3>Back-up & analyse</h3><div class="sub">Je gegevens blijven lokaal in Safari staan. Maak af en toe een back-up.</div><div class="actions"><button id="exportJson" class="btn secondary">JSON back-up</button><button id="exportCsv" class="btn secondary">CSV export</button><label class="btn secondary" style="text-align:center">JSON import<input hidden type="file" id="importJson" accept="application/json"></label></div></div></section>
</main>
<nav><button class="navbtn active" data-page="home"><b>⌂</b>Overzicht</button><button class="navbtn" data-page="entry"><b>＋</b>Invoer</button><button class="navbtn" data-page="history"><b>≡</b>Dagen</button><button class="navbtn" data-page="more"><b>⚙︎</b>Meer</button></nav>

const $=id=>document.getElementById(id); const fields=['date','weight','sleep','cycleDay','cyclePhase','progesterone','lenzetto','stool','bloatMorning','bloatEvening','breakfast','lunch','snacks','dinner','extra','hunger','cola','coffee','movementMin','movementText','kcal','protein','denseFoods','notes'];
let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed; let editing=null;

function save(){localStorage.setItem(KEY,JSON.stringify(data))} function settings(){return JSON.parse(localStorage.getItem(SET)||'{"goal":63,"pace":0.4}')} function saveSet(s){localStorage.setItem(SET,JSON.stringify(s))}
function weights(){return data.filter(d=>d.weight!=null).sort((a,b)=>a.date.localeCompare(b.date))}
function renderHome(){const w=weights(),last=w.at(-1),s=settings();$('lastWeight').textContent=last?fmt(last.weight)+' kg':'—';$('toGoal').textContent=last?fmt(Math.max(0,last.weight-s.goal))+' kg':'—';const recent=w.slice(-8),min=Math.min(...recent.map(x=>x.weight),63),max=Math.max(...recent.map(x=>x.weight),70);$('chart').innerHTML=recent.map(x=>{const h=35+95*(x.weight-min)/Math.max(.1,max-min);return `<div class="bar" style="height:${h}px"><span>${fmt(x.weight)}</span></div>`}).join('');const last7=data.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-7);const move=last7.map(d=>d.movementMin).filter(v=>v!=null);const symptoms=last7.filter(d=>(d.bloatEvening||0)>=4).length;let t='';if(w.length>1){const change=last.weight-w[0].weight;t+=`Van je eerste geregistreerde gewicht (${fmt(w[0].weight)} kg) naar je laatste (${fmt(last.weight)} kg) is de verandering ${change<=0?'−':'+'}${fmt(Math.abs(change))} kg. `}t+=`Losse wegingen rond menstruatie worden niet als vettoename gezien. `;if(move.length)t+=`De laatste dagen is gemiddeld ${Math.round(move.reduce((a,b)=>a+b,0)/move.length)} min/dag beweging geregistreerd; te weinig activiteit lijkt daarom niet de hoofdverklaring. `;t+=`Omdat kcal en porties vaak ontbreken, kan een klein energietekort worden gemaskeerd door energiedichte toevoegingen zoals noten, avocado, kaas, sauzen, granola/cornflakes, chocolade en koffiedranken. `;t+=symptoms?`Er waren ${symptoms} dagen met duidelijke buikklachten.`:'De recente buikklachten zijn grotendeels verdwenen.';$('analysis').textContent=t;goalText()}
function renderHistory(){$('historyList').innerHTML=[...data].sort((a,b)=>b.date.localeCompare(a.date)).map(d=>`<div class="day" data-date="${d.date}"><div class="daytop"><strong>${fd(d.date)}</strong><span>${d.weight!=null?fmt(d.weight)+' kg':'—'}</span></div><div class="daymeta">cyclus ${d.cycleDay??'—'} ${d.cyclePhase||''} · ontlasting ${d.stool==null?'—':d.stool===0?'nee':d.stool===1?'1x':'2x+'} · buik ${d.bloatEvening==null?'—':d.bloatEvening+'/10'} · ${d.movementText||''}</div></div>`).join('');document.querySelectorAll('.day').forEach(el=>el.onclick=()=>loadDay(el.dataset.date))}
function loadDay(date){const d=data.find(x=>x.date===date);editing=date;fields.forEach(f=>$(f).value=d[f]??'');show('entry')}
function blank(){editing=null;$('form').reset();$('date').value=new Date().toISOString().slice(0,10);$('lenzetto').value=1}
$('form').onsubmit=e=>{e.preventDefault();const d={};fields.forEach(f=>d[f]=['weight','sleep','cycleDay','progesterone','lenzetto','stool','bloatMorning','bloatEvening','hunger','cola','coffee','movementMin','kcal','protein'].includes(f)?num(f):$(f).value);data=data.filter(x=>x.date!==editing&&x.date!==d.date);data.push(d);data.sort((a,b)=>a.date.localeCompare(b.date));save();editing=d.date;renderAll();alert('Dag opgeslagen.')};$('clear').onclick=blank;
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='home')renderHome();if(id==='history')renderHistory();if(id==='more'){const s=settings();$('goal').value=s.goal;$('pace').value=s.pace;goalText()}}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>show(b.dataset.page));
function goalText(){const s={goal:+$('goal').value||63,pace:+$('pace').value||.4},last=weights().at(-1);if(!last){$('goalText').textContent='Voer een gewicht in.';return}const kg=Math.max(0,last.weight-s.goal),weeks=kg/s.pace;$('goalText').innerHTML=`Nog <strong>${fmt(kg)} kg</strong> tot ${fmt(s.goal)} kg. Bij ongeveer ${fmt(s.pace)} kg per week is dat grofweg ${Math.ceil(weeks)} weken. Gebruik dit als richtlijn; cyclus en vocht kunnen de schaal tijdelijk beïnvloeden.`}
$('saveSettings').onclick=()=>{saveSet({goal:+$('goal').value,pace:+$('pace').value});goalText();renderHome();alert('Instellingen opgeslagen.')};
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('exportJson').onclick=()=>dl('mijn-balans-backup.json',JSON.stringify({data,settings:settings()},null,2),'application/json');$('exportCsv').onclick=()=>{const cols=fields,esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';dl('mijn-balans.csv',[cols.join(','),...data.map(d=>cols.map(c=>esc(d[c])).join(','))].join('\n'),'text/csv')};$('importJson').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());data=Array.isArray(o)?o:o.data;if(!Array.isArray(data))throw Error();save();if(o.settings)saveSet(o.settings);renderAll();alert('Back-up geïmporteerd.')}catch{alert('Importeren mislukt.')}};
function renderAll(){renderHome();renderHistory()} blank();renderAll(); if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
